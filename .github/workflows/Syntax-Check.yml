name: Python syntax check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 🌟 在这里注入全局环境变量，强制要求 actions 在 Node.js 24 环境下运行，消除警告。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Syntax (Compile)
        run: |
          python -m py_compile *.py providers/*.py subtitles/*.py
