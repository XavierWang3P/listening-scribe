<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <title>{title} - Listening Scribe</title>
  <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
  <style>{css}</style>
</head>
<body>
  <header class="app-header">
    <div class="container-xxl py-3 px-3 px-md-4">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <a class="app-brand" href="/" aria-label="Listening Scribe 首页">
          <img class="app-logo" src="/assets/img/logo.png" alt="" width="36" height="36">
          <span class="app-title">Listening Scribe</span>
        </a>
        <a class="back-link" href="/">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/></svg>
          返回首页
        </a>
      </div>
    </div>
  </header>

  <div class="player-bar">
    <div class="container-xxl py-3 px-3 px-md-4">
      <h1 class="result-title">{title}</h1>
      <div class="card">
        <div class="card-body py-3">
          <audio id="audio" class="audio-player" preload="metadata">
            <source src="{audio_src}" type="{audio_type}">
          </audio>
          <div class="d-flex gap-4 align-items-center">
          <!-- Visual Anchor -->
          <div class="rounded-4 d-flex align-items-center justify-content-center text-white" style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--accent-100), var(--asr-accent)); box-shadow: 0 8px 16px var(--primary-200); flex-shrink: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-soundwave" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8.5 2a.5.5 0 0 1 .5.5v11a.5.5 0 0 1-1 0v-11a.5.5 0 0 1 .5-.5zm-2 2a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zm4 0a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zm-6 1.5A.5.5 0 0 1 5 6v4a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm8 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm-10 1A.5.5 0 0 1 3 7v2a.5.5 0 0 1-1 0V7a.5.5 0 0 1 .5-.5zm12 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0V7a.5.5 0 0 1 .5-.5z"/>
            </svg>
          </div>
          
          <div class="custom-player flex-grow-1" style="margin-bottom: 0;">
            <!-- 单行：[▶] [0:00 / 9:00] [══════进度条══════] -->
            <div class="player-main">
              <button id="playToggle" class="btn btn-primary player-play flex-shrink-0" type="button" aria-label="播放">
                <svg id="playIconSvg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                  <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                </svg>
                <svg id="pauseIconSvg" class="d-none" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
                  <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
                </svg>
              </button>
              <span id="currentTime" class="player-time-val">0:00</span>
              <label class="visually-hidden" for="seek">播放进度</label>
              <input id="seek" class="player-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度">
              <span id="durationTime" class="player-time-val">--:--</span>
            </div>
            <!-- 工具栏 -->
            <div class="player-toolbar">
              <div class="playback-controls">
                <div class="control-field">
                  <span class="control-label" style="color: var(--asr-muted); font-size: 0.85rem;">倍速</span>
                  <div class="btn-group btn-group-sm rate-buttons" role="group" aria-label="播放速度">
                    <button class="btn btn-outline-primary rate-button" type="button" data-rate="0.75">0.75x</button>
                    <button class="btn btn-outline-primary rate-button active" type="button" data-rate="1" aria-pressed="true">1x</button>
                    <button class="btn btn-outline-primary rate-button" type="button" data-rate="1.25">1.25x</button>
                    <button class="btn btn-outline-primary rate-button" type="button" data-rate="1.5">1.5x</button>
                    <button class="btn btn-outline-primary rate-button" type="button" data-rate="2">2x</button>
                  </div>
                </div>
                <div class="control-field ms-4">
                  <span class="control-label" style="color: var(--asr-muted); font-size: 0.85rem;">快进/退</span>
                  <div class="btn-group btn-group-sm rate-buttons" role="group" aria-label="进度微调">
                    <button id="back3" class="btn btn-outline-primary rate-button" type="button" title="后退 3 秒" aria-label="后退 3 秒">
                      -3s
                    </button>
                    <button id="forward3" class="btn btn-outline-primary rate-button" type="button" title="前进 3 秒" aria-label="前进 3 秒">
                      +3s
                    </button>
                  </div>
                </div>
              </div>
              <div class="setting-controls">
                <div class="form-check form-switch m-0">
                  <input class="form-check-input" type="checkbox" role="switch" id="hideText">
                  <label class="form-check-label text-secondary small" for="hideText">隐藏转写文本</label>
                </div>
              </div>
            </div>
          </div>
        </div>
          <div id="audioError" class="alert alert-danger py-2 mt-3 mb-0 d-none" role="alert"></div>
        </div>
      </div>
    </div>
  </div>

  <main class="container-xxl py-4 px-3 px-md-4">
    <section>
      <div class="d-flex align-items-center justify-content-between gap-3 mb-3 flex-wrap">
        <div class="d-flex align-items-center gap-2">
          <h2 class="subtitle-section-title">字幕</h2>
          <span class="badge rounded-pill" style="background:var(--asr-accent-soft);color:var(--asr-accent);font-size:var(--asr-type-meta);font-weight:600;border:1px solid var(--asr-border);">{cue_count} 条</span>
        </div>
        <div class="btn-group btn-group-sm layout-switcher" role="group" aria-label="排版模式">
          <button id="layoutListBtn" class="btn btn-outline-primary" type="button" style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-list-task me-1" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M2 2.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5V3a.5.5 0 0 0-.5-.5zM3 3H2v1h1z"/>
              <path d="M5 3.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5zM5.5 7a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1zM5.5 11a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1z"/>
              <path fill-rule="evenodd" d="M2 7a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1A.5.5 0 0 1 2 8zm1 .5H2v1h1zM2 11a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm1 .5H2v1h1z"/>
            </svg>
            列表模式
          </button>
          <button id="layoutParagraphBtn" class="btn btn-outline-primary active" type="button" aria-pressed="true" style="border-top-left-radius: 0; border-bottom-left-radius: 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-justify-left me-1" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M2 12.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5m0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5"/>
            </svg>
            段落模式
          </button>
        </div>
      </div>
      <div class="subtitle-list layout-paragraph">
        {cue_items}
      </div>
    </section>
  </main>

  <footer class="app-footer mt-4">
    <div class="container-xxl py-3 px-3 px-md-4 d-flex align-items-center justify-content-between gap-3 flex-wrap">
      <span class="footer-text">© {year} Listening Scribe</span>
      <a class="footer-text" href="/" style="text-decoration:none;color:var(--asr-accent);">返回首页</a>
    </div>
  </footer>

  <script src="/assets/js/bootstrap.bundle.min.js"></script>
  <script>
    // 注入动态数据供 result.js 使用
    window.CUE_DATA = {cue_data_json};
    window.AUDIO_SRC = {audio_src_json};
  </script>
  <script>{js}</script>
</body>
</html>
