<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听力转写助手 - Listening Scribe</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="container-xxl py-3 px-3 px-md-4">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <div class="app-brand">
          <img class="app-logo" src="/assets/img/logo.png" alt="" width="36" height="36">
          <h1 class="app-title m-0" data-text="appTitle"></h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container-xxl py-4 px-3 px-md-4">
    <div class="row g-3 align-items-start">
      <aside class="col-lg-4 col-xl-3">
        <section class="card history-panel">
          <div class="card-body pb-3">
            <div class="d-flex align-items-center justify-content-between gap-2">
              <div>
                <h2 class="h5 mb-1" data-text="historyTitle"></h2>
                <div id="historyCount" class="small text-secondary" data-text="loading"></div>
              </div>
              <button id="refreshHistory" class="btn btn-soft btn-sm" type="button" data-text="refresh"></button>
            </div>
          </div>
          <div class="card-body pt-0">
            <div id="historyList" class="history-list d-grid gap-2">
              <div class="empty-state" data-text="loadingEllipsis"></div>
            </div>
          </div>
        </section>
      </aside>

      <div class="col-lg-8 col-xl-9">
        <div class="d-grid gap-3">
          <section class="card">
            <div class="card-body">
              <form id="uploadForm" class="row g-3 align-items-center">
                <label for="audio" class="col-sm-2 col-form-label form-label" data-text="audioFileLabel"></label>
                <div class="col-sm-10">
                  <input id="audio" class="form-control" type="file" accept="audio/*">
                </div>

                <label for="title" class="col-sm-2 col-form-label form-label" data-text="titleLabel"></label>
                <div class="col-sm-10">
                  <input id="title" class="form-control" type="text" data-placeholder="titlePlaceholder">
                </div>

                <div class="col-sm-2 form-label" data-text="recognitionOptionsLabel"></div>
                <div class="col-sm-10">
                  <div class="form-check form-switch">
                    <input id="force" class="form-check-input" type="checkbox" role="switch">
                    <label class="form-check-label" for="force" data-text="forceLabel"></label>
                  </div>
                </div>

                <div class="col-sm-10 offset-sm-2 d-flex flex-wrap gap-2 pt-1">
                  <button id="start" class="btn btn-primary" type="submit" data-text="startButton"></button>
                  <button id="clear" class="btn btn-soft" type="button" data-text="clearButton"></button>
                </div>
              </form>
            </div>
          </section>

          <section class="card">
            <div class="card-body">
              <div id="status" class="alert alert-secondary py-2 mb-3" role="status" data-text="waitingStatus"></div>
              <div class="progress mb-3" role="progressbar" data-aria-label="progressLabel" aria-valuemin="0" aria-valuemax="100">
                <div id="progressBar" class="progress-bar" style="width: 0%"></div>
              </div>
              <div id="links" class="result-links"></div>
            </div>
          </section>

          <section class="card">
            <div class="card-body">
              <pre id="log" class="log-box"></pre>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/texts.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
