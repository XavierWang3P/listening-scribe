<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听力转写助手 - Listening Scribe</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/app.css" rel="stylesheet">
</head>
<body style="padding-bottom:3rem">
  <header class="app-header">
    <div class="container-xxl py-3 px-3 px-md-4">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <div class="app-brand">
          <img class="app-logo" src="/assets/img/logo.png" alt="" width="36" height="36">
          <h1 class="app-title m-0" data-text="appTitle"></h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container-xxl py-4 px-3 px-md-4">
    <div class="row g-3 align-items-stretch">
      <aside class="col-lg-4 col-xl-3">
        <section class="card history-panel h-100">
          <div class="card-body pb-3">
            <div class="d-flex align-items-center justify-content-between gap-2">
              <div>
                <h2 class="h5 mb-1" data-text="historyTitle"></h2>
                <div id="historyCount" class="small text-secondary" data-text="loading"></div>
              </div>
              <button id="refreshHistory" class="btn btn-soft btn-sm" type="button" data-text="refresh"></button>
            </div>
          </div>
          <div class="card-body pt-0">
            <div id="historyList" class="history-list d-grid gap-2">
              <div class="empty-state" data-text="loadingEllipsis"></div>
            </div>
          </div>
        </section>
      </aside>

      <div class="col-lg-8 col-xl-9">
        <div class="d-flex flex-column gap-3 h-100">
          <section class="card">
            <div class="card-body">
              <form id="uploadForm" class="row g-3 align-items-center">
                <label for="audio" class="col-sm-2 col-form-label form-label" data-text="audioFileLabel"></label>
                <div class="col-sm-10">
                  <input id="audio" class="form-control" type="file" accept="audio/*">
                </div>

                <label for="title" class="col-sm-2 col-form-label form-label" data-text="titleLabel"></label>
                <div class="col-sm-10">
                  <input id="title" class="form-control" type="text" data-placeholder="titlePlaceholder">
                </div>

                <label for="provider" class="col-sm-2 col-form-label form-label" data-text="providerLabel"></label>
                <div class="col-sm-10">
                  <div class="provider-picker">
                    <select id="provider" class="visually-hidden" tabindex="-1" aria-hidden="true"></select>
                    <div class="dropdown provider-dropdown">
                      <button
                        id="providerDropdownButton"
                        class="btn provider-dropdown-toggle dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                      ></button>
                      <ul id="providerDropdownMenu" class="dropdown-menu provider-dropdown-menu"></ul>
                    </div>
                    <button
                      id="liveToastBtn"
                      class="btn btn-outline-primary btn-sm provider-guide-button"
                      type="button"
                      aria-label="服务商指引"
                    ></button>
                  </div>
                </div>

                <label id="credentialKeyLabel" for="credentialKey" class="col-sm-2 col-form-label form-label"></label>
                <div class="col-sm-10">
                  <input id="credentialKey" class="form-control" type="password" autocomplete="off">
                  <div id="credentialHint" class="field-hint"></div>
                </div>

                <label id="credentialSecretLabel" for="credentialSecret" class="col-sm-2 col-form-label form-label provider-secret-row is-hidden"></label>
                <div class="col-sm-10 provider-secret-row is-hidden">
                  <input id="credentialSecret" class="form-control" type="password" autocomplete="off">
                </div>

                <div class="col-sm-2 col-form-label form-label" data-text="recognitionOptionsLabel"></div>
                <div class="col-sm-10 d-flex flex-wrap gap-3 align-items-center" style="min-height: 2.45rem;">
                  <div class="form-check mb-0">
                    <input id="rememberCredentials" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="rememberCredentials" data-text="rememberCredentialsLabel"></label>
                  </div>
                  <div class="form-check mb-0 ms-md-2">
                    <input id="force" class="form-check-input" type="checkbox">
                    <label class="form-check-label" for="force" data-text="forceLabel"></label>
                  </div>
                </div>

                <div class="col-sm-10 offset-sm-2 d-flex flex-wrap gap-2 pt-1">
                  <button id="start" class="btn btn-primary" type="submit" data-text="startButton"></button>
                  <button id="clear" class="btn btn-soft" type="button" data-text="clearButton"></button>
                </div>
              </form>
            </div>
          </section>

          <section class="card status-log-card">
            <div class="card-body d-flex flex-column gap-3">
              <!-- 状态 + 进度 + 结果链接 -->
              <div>
                <div id="status" class="status-display" role="status" data-text="waitingStatus"></div>
                <div class="progress mt-2" role="progressbar" data-aria-label="progressLabel" aria-valuemin="0" aria-valuemax="100">
                  <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>
              </div>
              <div id="links" class="result-links"></div>
              <!-- 单行日志（融入卡片风格，占满剩余高度） -->
              <pre id="log" class="log-line" aria-live="polite"></pre>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container provider-toast-container position-fixed bottom-0 end-0 p-3">
    <div id="providerGuideToast" class="toast provider-guide-toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-header">
        <div class="provider-guide-title me-auto" id="providerGuideTitle"></div>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="关闭"></button>
      </div>
      <div class="toast-body">
        <div id="providerGuideMeta" class="provider-guide-meta"></div>
        <ul id="providerGuideList" class="provider-guide-list"></ul>
        <a id="providerGuideLink" class="btn btn-soft btn-sm mt-2" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>

  <footer class="app-footer mt-4">
    <div class="container-xxl py-3 px-3 px-md-4 d-flex align-items-center justify-content-between gap-3 flex-wrap">
      <span class="footer-text">© 2025 Listening Scribe</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/texts.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
